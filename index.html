<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexica — Spaced Repetition</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f4f9f4; --surface: #ffffff; --surface2: #edf5ed;
      --border: #d4e8d4; --border2: #b0d4b0;
      --text: #1a2e1a; --text2: #4a6b4a; --text3: #7a9b7a;
      --accent: #2d7a2d;
      --blue-bg: #e8f0fb; --blue-text: #1a4a8a;
      --green-bg: #e4f5ec; --green-text: #1a6b3a;
      --amber-bg: #fdf0db; --amber-text: #7a4a0a;
      --red-bg: #fdecea; --red-text: #8a2020;
      --teal-bg: #e0f4ef; --teal-text: #0a5a46;
      --radius: 10px; --radius-lg: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1a0f; --surface: #1a2e1a; --surface2: #223022;
        --border: #2a4a2a; --border2: #3a6a3a;
        --text: #e0f0e0; --text2: #90bb90; --text3: #5a8a5a;
        --accent: #4aaa4a;
        --blue-bg: #0e2040; --blue-text: #90b8f0;
        --green-bg: #0a2818; --green-text: #7ad0a0;
        --amber-bg: #2a1e08; --amber-text: #f0b860;
        --red-bg: #280e0e; --red-text: #f09090;
        --teal-bg: #082018; --teal-text: #60c8a8;
      }
      body { background: #0f1a0f; }
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; }
    #app { max-width: 560px; margin: 0 auto; padding: 0 1rem 3rem; }
    header { display: flex; align-items: center; gap: 12px; padding: 1.25rem 0 1rem; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; }
    .brand { flex: 1; }
    .brand h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; color: var(--accent); }
    .brand p { font-size: 12px; color: var(--text3); margin-top: 1px; }
    nav { display: flex; gap: 6px; }
    .tab { font-size: 13px; padding: 5px 13px; border-radius: 999px; border: 1px solid var(--border); background: transparent; color: var(--text2); cursor: pointer; transition: all .15s; font-weight: 500; }
    .tab:hover { background: var(--surface2); color: var(--text); }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .hidden { display: none !important; }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.25rem; }
    .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
    .stat-label { font-size: 12px; color: var(--text3); margin-bottom: 4px; }
    .stat-val { font-size: 26px; font-weight: 600; color: var(--accent); line-height: 1; }

    /* Buttons */
    .btn-primary { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer; transition: opacity .15s; }
    .btn-primary:hover { opacity: .85; }
    .btn-secondary { padding: 7px 16px; background: transparent; color: var(--text2); border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; transition: all .15s; }
    .btn-secondary:hover { background: var(--surface2); color: var(--text); }
    .btn-center { display: flex; justify-content: center; margin-top: 10px; }
    .btn-center .btn-primary { width: auto; padding: 8px 28px; }

    /* Motivational */
    .motto-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 18px; margin-bottom: 1.25rem; text-align: center; }
    .motto-text { font-size: 14px; color: var(--text2); font-style: italic; line-height: 1.6; }
    .motto-lang { font-size: 11px; color: var(--text3); margin-top: 4px; }

    /* Word group */
    .word-group { margin-bottom: 12px; border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
    .word-group-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: var(--surface2); cursor: pointer; user-select: none; }
    .word-group-title { font-size: 13px; font-weight: 600; color: var(--text); }
    .word-group-meta { font-size: 12px; color: var(--text3); }
    .word-group-arrow { font-size: 12px; color: var(--text3); transition: transform .2s; }
    .word-group-arrow.open { transform: rotate(180deg); }
    .word-group-body { display: none; }
    .word-group-body.open { display: block; }
    .word-list { display: flex; flex-direction: column; }
    .word-item { display: flex; align-items: center; gap: 10px; background: var(--surface); border-top: 1px solid var(--border); padding: 10px 14px; font-size: 13px; cursor: pointer; transition: background .12s; }
    .word-item:hover { background: var(--surface2); }
    .word-item .name { font-weight: 600; min-width: 100px; color: var(--text); }
    .word-item .def { color: var(--text2); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .badge { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
    .badge-due { background: var(--amber-bg); color: var(--amber-text); }
    .badge-new { background: var(--green-bg); color: var(--green-text); }
    .badge-ok  { background: var(--surface2); color: var(--text3); }
    .empty { text-align: center; color: var(--text3); font-size: 14px; padding: 2.5rem 0; }

    /* Import */
    .import-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem; margin-bottom: 1.25rem; }
    .import-box label { font-size: 13px; color: var(--text2); display: block; margin-bottom: 8px; }
    .import-box textarea { width: 100%; height: 100px; resize: vertical; font-size: 14px; font-family: monospace; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface2); color: var(--text); line-height: 1.6; }
    .import-box textarea:focus { outline: none; border-color: var(--border2); }
    .lang-select { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface2); color: var(--text); font-size: 14px; margin-bottom: 10px; cursor: pointer; }
    .lang-select:focus { outline: none; border-color: var(--accent); }
    #import-status { font-size: 12px; display: block; margin-top: 6px; text-align: center; min-height: 16px; }
    .log { margin-top: 10px; display: flex; flex-direction: column; gap: 3px; max-height: 200px; overflow-y: auto; }
    .log-ok      { font-size: 12px; color: var(--green-text); }
    .log-skip    { font-size: 12px; color: var(--text3); }
    .log-err     { font-size: 12px; color: var(--red-text); }
    .log-loading { font-size: 12px; color: var(--text3); }

    /* Library collapsible */
    .library-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; cursor: pointer; user-select: none; padding: 4px 0; }
    .section-title { font-size: 13px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: .6px; }
    .library-arrow { font-size: 12px; color: var(--text3); transition: transform .2s; }
    .library-arrow.open { transform: rotate(180deg); }

    /* File drop */
    .file-drop-area { border: 1.5px dashed var(--border2); border-radius: var(--radius); padding: 20px 16px; text-align: center; cursor: pointer; transition: all .15s; background: var(--surface2); }
    .file-drop-area:hover, .file-drop-area.dragover { border-color: var(--accent); background: var(--surface); }
    .file-drop-icon { font-size: 26px; margin-bottom: 6px; }
    .file-drop-text { font-size: 14px; color: var(--text); font-weight: 500; margin-bottom: 3px; }
    .file-drop-sub  { font-size: 12px; color: var(--text3); }

    /* Card */
    .card-meta { text-align: center; font-size: 13px; color: var(--text3); margin-bottom: 10px; }
    .progress-bar { height: 3px; background: var(--border); border-radius: 99px; margin-bottom: 14px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
    .card-scene { perspective: 1000px; margin-bottom: 14px; }
    .card-inner { position: relative; width: 100%; height: 230px; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.4,0,.2,1); cursor: pointer; }
    .card-inner.flipped { transform: rotateY(180deg); }
    .card-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; text-align: center; }
    .card-back { transform: rotateY(180deg); }
    .card-word { font-size: 32px; font-weight: 600; letter-spacing: -0.5px; color: var(--text); margin-bottom: 6px; }
    .card-phon { font-size: 16px; color: var(--text2); font-style: italic; margin-bottom: 8px; }
    .card-pos  { display: inline-block; font-size: 11px; font-weight: 500; padding: 2px 9px; border-radius: 999px; background: var(--surface2); color: var(--text3); margin-bottom: 10px; }
    .card-def  { font-size: 15px; color: var(--text); line-height: 1.6; max-width: 340px; }
    .card-ex   { font-size: 13px; color: var(--text2); font-style: italic; line-height: 1.55; max-width: 340px; margin-top: 10px; border-left: 2px solid var(--border2); padding-left: 12px; text-align: left; }
    .card-hint { font-size: 12px; color: var(--text3); margin-top: 12px; }

    /* Card nav arrows */
    .card-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .card-arrow { background: transparent; border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 16px; font-size: 18px; cursor: pointer; color: var(--text2); transition: all .15s; }
    .card-arrow:hover { background: var(--surface2); color: var(--accent); border-color: var(--accent); }
    .card-arrow:disabled { opacity: .3; cursor: default; }

    /* Feedback */
    .feedback { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .fb { padding: 10px 6px; border-radius: var(--radius); border: 1px solid var(--border); background: transparent; cursor: pointer; text-align: center; font-size: 13px; font-weight: 500; color: var(--text); transition: all .15s; line-height: 1.3; }
    .fb small { font-size: 11px; display: block; color: var(--text3); margin-top: 2px; font-weight: 400; }
    .fb.q0 { border-color: #f09595; } .fb.q0:hover { background: var(--red-bg);   color: var(--red-text); }
    .fb.q1 { border-color: #fac775; } .fb.q1:hover { background: var(--amber-bg); color: var(--amber-text); }
    .fb.q2 { border-color: #9fe1cb; } .fb.q2:hover { background: var(--teal-bg);  color: var(--teal-text); }
    .fb.q3 { border-color: #85b7eb; } .fb.q3:hover { background: var(--blue-bg);  color: var(--blue-text); }

    /* Review bottom */
    .review-bottom { display: flex; justify-content: center; margin-top: 14px; }

    /* Done */
    .done { text-align: center; padding: 3rem 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
    .done-icon { font-size: 40px; margin-bottom: 12px; }
    .done h2 { font-size: 18px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .done p  { font-size: 14px; color: var(--text2); margin-bottom: 20px; }

    /* Del btn */
    .del-btn { margin-left: auto; font-size: 12px; color: var(--text3); background: transparent; border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; cursor: pointer; flex-shrink: 0; }
    .del-btn:hover { background: var(--red-bg); color: var(--red-text); border-color: var(--red-text); }
  </style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><h1>Lexica</h1><p>spaced repetition</p></div>
    <nav>
      <button class="tab active" data-page="home"   onclick="nav('home')">Home</button>
      <button class="tab"        data-page="review" onclick="nav('review')">Review</button>
      <button class="tab"        data-page="import" onclick="nav('import')">Import</button>
    </nav>
  </header>

  <!-- HOME -->
  <section id="page-home">
    <div class="motto-box"><div class="motto-text" id="motto-text"></div><div class="motto-lang" id="motto-lang"></div></div>
    <div class="stats">
      <div class="stat"><div class="stat-label">Due Today</div><div class="stat-val" id="s-due">0</div></div>
      <div class="stat"><div class="stat-label">New Today</div><div class="stat-val" id="s-new">0</div></div>
      <div class="stat"><div class="stat-label">Total</div><div class="stat-val" id="s-total">0</div></div>
    </div>
    <button class="btn-primary" onclick="nav('review')" style="margin-bottom:1.5rem">Start Review Session</button>
    <div id="home-groups"></div>
  </section>

  <!-- REVIEW -->
  <section id="page-review" class="hidden">
    <div id="review-area"></div>
  </section>

  <!-- IMPORT -->
  <section id="page-import" class="hidden">
    <div class="import-box">
      <label>选择语言 / Select Language</label>
      <select class="lang-select" id="lang-select">
        <option value="en">🇬🇧 English（英语）</option>
        <option value="es">🇪🇸 Español（西班牙语）</option>
        <option value="ja">🇯🇵 日本語（日语）</option>
        <option value="ko">🇰🇷 한국어（韩语）</option>
        <option value="yue">🇭🇰 粤语</option>
      </select>
      <label>输入单词 — 每行一个或逗号分隔</label>
      <textarea id="import-input" placeholder="ephemeral&#10;serendipity&#10;lucid"></textarea>
      <div class="btn-center">
        <button class="btn-primary" onclick="doImport()">Import Words</button>
      </div>
      <span id="import-status"></span>
    </div>

    <div class="import-box">
      <label>上传本地文件（.txt / .csv / .md，每行一个单词）</label>
      <div class="file-drop-area" id="file-drop-area" onclick="document.getElementById('file-input').click()">
        <div class="file-drop-icon">📄</div>
        <div class="file-drop-text">点击选择文件，或拖拽文件到此处</div>
        <div class="file-drop-sub">支持 .txt、.csv、.md 格式</div>
        <input type="file" id="file-input" accept=".txt,.csv,.md" style="display:none" onchange="handleFileUpload(event)">
      </div>
      <div class="log" id="import-log"></div>
    </div>

    <div class="library-header" onclick="toggleLibrary()">
      <span class="section-title">Library</span>
      <span class="library-arrow" id="library-arrow">▼</span>
    </div>
    <div id="import-list" style="display:none"></div>
  </section>
</div>

<script>
// ── Storage ──────────────────────────────────────────────
const KEY = 'lexica_v2';
const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { return []; } };
const save = db => localStorage.setItem(KEY, JSON.stringify(db));
const today = () => new Date().toISOString().slice(0,10);
const isDue  = c => !c.nextReview || c.nextReview <= today();

// ── Language config ───────────────────────────────────────
const LANG_CONFIG = {
  en:  { label: '英语', flag: '🇬🇧', langpair: null },
  es:  { label: '西语', flag: '🇪🇸', langpair: 'es|zh' },
  ja:  { label: '日语', flag: '🇯🇵', langpair: 'ja|zh' },
  ko:  { label: '韩语', flag: '🇰🇷', langpair: 'ko|zh' },
  yue: { label: '粤语', flag: '🇭🇰', langpair: 'zh-TW|zh' },
};

// ── Mottos ────────────────────────────────────────────────
const MOTTOS = [
  { text: '每天进步一点点，终将成就大不同。', lang: '中文' },
  { text: '语言是通往另一个世界的钥匙。', lang: '中文' },
  { text: '坚持是最好的天赋。', lang: '中文' },
  { text: '积累从不辜负努力的人。', lang: '中文' },
  { text: 'A journey of a thousand miles begins with a single step.', lang: 'English' },
  { text: 'Every word you learn opens a new door.', lang: 'English' },
  { text: 'Small daily improvements lead to stunning results.', lang: 'English' },
  { text: 'The more languages you know, the more you are human.', lang: 'English' },
  { text: 'El aprendizaje es un tesoro que seguirá a su dueño a todas partes.', lang: 'Español' },
  { text: 'Poco a poco se va lejos.', lang: 'Español' },
  { text: 'Cada palabra aprendida es una victoria.', lang: 'Español' },
];

const MOTTO_KEY = 'lexica_motto';

function getMotto() {
  const stored = JSON.parse(localStorage.getItem(MOTTO_KEY) || '{}');
  const t = today();
  if (stored.date !== t) {
    // new day, reset
    stored.date = t; stored.count = 0; stored.idx = Math.floor(Math.random() * MOTTOS.length);
  } else if (stored.count < 3) {
    stored.idx = Math.floor(Math.random() * MOTTOS.length);
  }
  stored.count = (stored.count || 0) + 1;
  localStorage.setItem(MOTTO_KEY, JSON.stringify(stored));
  return MOTTOS[stored.idx % MOTTOS.length];
}

// ── SM-2 ──────────────────────────────────────────────────
function sm2(card, q) {
  let { ef = 2.5, reps = 0, interval = 1 } = card;
  ef = Math.max(1.3, ef + 0.1 - (3 - q) * (0.08 + (3 - q) * 0.02));
  if (q < 2) { reps = 0; interval = 1; }
  else { reps++; if (reps===1) interval=1; else if (reps===2) interval=6; else interval=Math.round(interval*ef); }
  const next = new Date(); next.setDate(next.getDate() + interval);
  return { ...card, ef, reps, interval, nextReview: next.toISOString().slice(0,10), lastReview: today() };
}

// ── Fetch word ────────────────────────────────────────────
async function fetchWordEN(word) {
  const r = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word.trim().toLowerCase())}`);
  if (!r.ok) throw new Error('not found');
  const [entry] = await r.json();
  const phon    = (entry.phonetics || []).find(p => p.text)?.text || '';
  const meaning = (entry.meanings || [])[0] || {};
  const def     = (meaning.definitions || [])[0] || {};
  return { word: entry.word || word, phonetic: phon, pos: meaning.partOfSpeech || '', definition: def.definition || '', example: def.example || '', lang: 'en' };
}

async function fetchWordTranslate(word, langpair) {
  const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(word.trim())}&langpair=${langpair}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('network error');
  const data = await r.json();
  const translation = data.responseData?.translatedText || '';
  if (!translation || translation.toLowerCase() === word.trim().toLowerCase()) throw new Error('no translation');
  return { word: word.trim(), phonetic: '', pos: '', definition: translation, example: '', lang: langpair.split('|')[0].split('-')[0] };
}

async function fetchWord(word, lang) {
  const cfg = LANG_CONFIG[lang];
  if (!cfg) throw new Error('unknown lang');
  if (lang === 'en') return fetchWordEN(word);
  return fetchWordTranslate(word, cfg.langpair);
}

// ── Parse words ───────────────────────────────────────────
function parseWords(text) {
  const words = [];
  const lines = text.split(/[\n,;\t\r]+/);
  for (const line of lines) {
    const parts = line.split('/');
    for (const part of parts) {
      const cleaned = part.replace(/[^\u0020-\uFFFF]/g, '').trim()
        .replace(/^[\s\p{P}]+|[\s\p{P}]+$/gu, '').trim();
      if (cleaned.length > 0) words.push(cleaned);
    }
  }
  return [...new Set(words.filter(w => w.length > 0))];
}

// ── Navigation ────────────────────────────────────────────
let todayNew = 0;

function nav(page) {
  ['home','review','import'].forEach(p => {
    document.getElementById('page-' + p).classList.toggle('hidden', p !== page);
    document.querySelector(`[data-page="${p}"]`).classList.toggle('active', p === page);
  });
  if (page === 'home')   renderHome();
  if (page === 'review') startReview();
  if (page === 'import') renderImportList();
}

// ── Home ──────────────────────────────────────────────────
function renderHome() {
  // Motto
  const m = getMotto();
  document.getElementById('motto-text').textContent = m.text;
  document.getElementById('motto-lang').textContent = m.lang;

  const db = load();
  document.getElementById('s-due').textContent   = db.filter(isDue).length;
  document.getElementById('s-new').textContent   = todayNew;
  document.getElementById('s-total').textContent = db.length;

  const el = document.getElementById('home-groups');
  if (!db.length) { el.innerHTML = '<div class="empty">No words yet — go to Import</div>'; return; }

  // Group by lang
  const groups = {};
  for (const c of db) {
    const l = c.lang || 'en';
    if (!groups[l]) groups[l] = [];
    groups[l].push(c);
  }

  el.innerHTML = Object.entries(groups).map(([lang, words]) => {
    const cfg = LANG_CONFIG[lang] || { label: lang, flag: '' };
    const due = words.filter(isDue).length;
    const wordItems = words.sort((a,b) => (isDue(a)?0:1)-(isDue(b)?0:1)).map(c => `
      <div class="word-item" onclick="startReviewFromWord('${c.word}','${lang}')">
        <span class="name">${c.word}</span>
        <span class="def">${c.definition || ''}</span>
        <span class="badge ${isDue(c)?'badge-due':'badge-ok'}">${isDue(c)?'Due':'OK'}</span>
      </div>`).join('');
    return `
      <div class="word-group">
        <div class="word-group-header" onclick="toggleGroup(this)">
          <span class="word-group-title">${cfg.flag} ${cfg.label}单词表</span>
          <span style="display:flex;align-items:center;gap:8px">
            <span class="word-group-meta">${words.length}词 · ${due}到期</span>
            <span class="word-group-arrow">▼</span>
          </span>
        </div>
        <div class="word-group-body">
          <div class="word-list">${wordItems}</div>
        </div>
      </div>`;
  }).join('');
}

function toggleGroup(header) {
  const body  = header.nextElementSibling;
  const arrow = header.querySelector('.word-group-arrow');
  const open  = body.classList.toggle('open');
  arrow.classList.toggle('open', open);
}

// ── Review ────────────────────────────────────────────────
let queue = [], qIdx = 0, flipped = false, prevStack = [];

function startReview(startWord = null, lang = null) {
  const db = load();
  let due = db.filter(isDue);
  if (lang) due = due.filter(c => c.lang === lang);
  if (startWord && lang) {
    const idx = due.findIndex(c => c.word === startWord);
    if (idx > 0) { const [item] = due.splice(idx, 1); due.unshift(item); }
  }
  queue = due; qIdx = 0; flipped = false; prevStack = [];
  renderCard();
}

function startReviewFromWord(word, lang) {
  nav('review');
  startReview(word, lang);
}

function renderCard() {
  const el = document.getElementById('review-area');
  if (!queue.length) {
    el.innerHTML = `<div class="done">
      <div class="done-icon">✓</div>
      <h2>All Caught Up!</h2>
      <p>No cards due right now — add more words or come back later</p>
      <button class="btn-secondary" onclick="nav('import')">Import Words →</button>
    </div>`; return;
  }
  if (qIdx >= queue.length) {
    el.innerHTML = `<div class="done">
      <div class="done-icon">★</div>
      <h2>Session Complete</h2>
      <p>Reviewed ${queue.length} card${queue.length > 1 ? 's' : ''} today</p>
      <div style="display:flex;gap:8px;justify-content:center">
        <button class="btn-secondary" onclick="nav('home')">Back To Home</button>
      </div>
    </div>`; return;
  }

  const c   = queue[qIdx];
  const pct = Math.round((qIdx / queue.length) * 100);
  flipped   = false;

  el.innerHTML = `
    <div class="card-meta">${qIdx + 1} / ${queue.length}</div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="card-nav">
      <button class="card-arrow" onclick="prevCard()" ${qIdx === 0 ? 'disabled' : ''}>←</button>
      <span style="font-size:12px;color:var(--text3)">${c.word}</span>
      <button class="card-arrow" onclick="skipCard()">→</button>
    </div>
    <div class="card-scene">
      <div class="card-inner" id="ci" onclick="flip()">
        <div class="card-face card-front">
          <div class="card-word">${c.word}</div>
          <div class="card-phon">${c.phonetic || ''}</div>
          <div class="card-hint">Tap To Reveal</div>
        </div>
        <div class="card-face card-back">
          ${c.pos ? `<span class="card-pos">${c.pos}</span>` : ''}
          <div class="card-def">${c.definition || '(no definition available)'}</div>
          ${c.example ? `<div class="card-ex">"${c.example}"</div>` : ''}
        </div>
      </div>
    </div>
    <div class="feedback hidden" id="fb">
      <button class="fb q0" onclick="rate(0)">陌生<small>Forgotten</small></button>
      <button class="fb q1" onclick="rate(1)">模糊<small>Hard</small></button>
      <button class="fb q2" onclick="rate(2)">熟悉<small>Good</small></button>
      <button class="fb q3" onclick="rate(3)">简单<small>Easy</small></button>
    </div>
    <div class="review-bottom">
      <button class="btn-secondary" onclick="nav('home')">Back</button>
    </div>`;
}

function flip() {
  if (flipped) return;
  flipped = true;
  document.getElementById('ci').classList.add('flipped');
  document.getElementById('fb').classList.remove('hidden');
}

function rate(q) {
  const db  = load();
  const idx = db.findIndex(x => x.word === queue[qIdx].word);
  if (idx >= 0) save(db.map((c, i) => i === idx ? sm2(c, q) : c));
  prevStack.push(qIdx);
  qIdx++; renderCard();
}

function prevCard() {
  if (qIdx === 0) return;
  qIdx--; flipped = false; renderCard();
}

function skipCard() {
  // Mark as easy (q=3) and move on
  const db  = load();
  const idx = db.findIndex(x => x.word === queue[qIdx].word);
  if (idx >= 0) save(db.map((c, i) => i === idx ? sm2(c, 3) : c));
  prevStack.push(qIdx);
  qIdx++; renderCard();
}

// ── Import ────────────────────────────────────────────────
async function importWordList(words, lang) {
  const log = document.getElementById('import-log');
  log.innerHTML = '';
  for (const w of words) {
    const db = load();
    if (db.find(x => x.word.toLowerCase() === w.toLowerCase())) {
      log.innerHTML += `<div class="log-skip">⊘ "${w}" Already in library</div>`;
      log.scrollTop = log.scrollHeight; continue;
    }
    const row = document.createElement('div');
    row.className = 'log-loading';
    row.textContent = `⋯ Fetching "${w}"…`;
    log.appendChild(row); log.scrollTop = log.scrollHeight;
    try {
      const info = await fetchWord(w, lang);
      const card = { ...info, ef:2.5, reps:0, interval:1, nextReview:today(), added:today() };
      const db2 = load(); db2.push(card); save(db2); todayNew++;
      row.className = 'log-ok';
      row.textContent = `✓ "${info.word}" — ${(info.definition||'').slice(0,60)}${(info.definition||'').length>60?'…':''}`;
    } catch {
      row.className = 'log-err';
      row.textContent = `✗ "${w}" — Not found`;
    }
    log.scrollTop = log.scrollHeight;
  }
  setStatus('Done！', 'ok');
  renderImportList();
  renderHome();
}

async function doImport() {
  const raw  = document.getElementById('import-input').value;
  const lang = document.getElementById('lang-select').value;
  if (!raw.trim()) { setStatus('Please enter some words first', 'err'); return; }
  const words = parseWords(raw);
  if (!words.length) { setStatus('No valid words found', 'err'); return; }
  document.getElementById('import-input').value = '';
  await importWordList(words, lang);
}

function handleFileUpload(e) {
  const file = e.target.files[0];
  if (file) parseFile(file);
  e.target.value = '';
}

function parseFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (!['txt','csv','md'].includes(ext)) { alert('仅支持 .txt、.csv、.md 格式'); return; }
  const reader = new FileReader();
  reader.onload = async function(evt) {
    const words = parseWords(evt.target.result);
    if (!words.length) { alert('文件中未检测到有效单词'); return; }
    const lang = document.getElementById('lang-select').value;
    await importWordList(words, lang);
  };
  reader.readAsText(file, 'UTF-8');
}

document.addEventListener('DOMContentLoaded', function() {
  const dropArea = document.getElementById('file-drop-area');
  if (!dropArea) return;
  dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.classList.add('dragover'); });
  dropArea.addEventListener('dragleave', () => dropArea.classList.remove('dragover'));
  dropArea.addEventListener('drop', e => {
    e.preventDefault(); dropArea.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) parseFile(file);
  });
});

function toggleLibrary() {
  const el    = document.getElementById('import-list');
  const arrow = document.getElementById('library-arrow');
  const open  = el.style.display === 'none';
  el.style.display = open ? 'block' : 'none';
  arrow.classList.toggle('open', open);
}

function setStatus(msg, type) {
  const el = document.getElementById('import-status');
  el.textContent = msg;
  el.style.color = type === 'err' ? 'var(--red-text)' : 'var(--green-text)';
  setTimeout(() => el.textContent = '', 3000);
}

function renderImportList() {
  const db = load();
  const el = document.getElementById('import-list');
  if (!db.length) { el.innerHTML = '<div class="empty">No words yet</div>'; return; }
  el.innerHTML = db.map(c => `
    <div class="word-item" style="cursor:default">
      <span class="name">${c.word}</span>
      <span class="def">${c.definition || ''}</span>
      <span class="badge ${c.reps ? 'badge-ok' : 'badge-new'}">${c.reps ? 'Rep ' + c.reps : 'New'}</span>
      <button class="del-btn" onclick="deleteWord('${c.word}')">Remove</button>
    </div>`).join('');
}

function deleteWord(word) {
  save(load().filter(c => c.word !== word));
  renderImportList(); renderHome();
}

renderHome();
</script>
</body>
</html>
